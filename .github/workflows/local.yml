name: fetch blocked feeds (Mac)
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: local
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --user feedparser requests curl_cffi
      - run: python3 build.py --local
      - name: commit
        run: |
          git config user.name "feed-bot-mac"
          git config user.email "feed-bot@users.noreply.github.com"
          git add cache-local.json
          git diff --cached --quiet && exit 0
          git commit -qm "local fetch"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: trigger site build
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
 
