<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeds</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#ddd; --link:#0645ad; --read:#999; --chip:#f2f2f2; --chip-on:#111; --chip-on-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#e6e6e6; --muted:#999; --line:#333; --link:#8ab4f8; --read:#666; --chip:#222; --chip-on:#e6e6e6; --chip-on-fg:#111; }
  }
  * { box-sizing:border-box }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; max-width:900px; margin-inline:auto }
  a { color:var(--link); text-decoration:none } a:hover { text-decoration:underline }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px }
  header h1 { font-size:16px; margin:0 }
  header .meta { color:var(--muted); font-size:13px }
  .controls { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 }
  .chip { border:0; background:var(--chip); color:var(--fg); font:inherit; font-size:13px; padding:3px 9px; border-radius:3px; cursor:pointer }
  .chip.on { background:var(--chip-on); color:var(--chip-on-fg) }
  .chip small { opacity:.65 }
  input[type=search], select { font:inherit; font-size:13px; padding:4px 6px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:3px; max-width:100% }
  input[type=search] { flex:1 1 180px }
  label.tog { font-size:13px; color:var(--muted); cursor:pointer; user-select:none }
  .day { margin:18px 0 6px; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line) }
  .it { display:grid; grid-template-columns:auto 1fr auto; gap:0 10px; padding:6px 0; align-items:baseline }
  .it .tm { color:var(--muted); font-size:12px; white-space:nowrap }
  .it .src { color:var(--muted); font-size:12px }
  .it .ttl { font-size:15px }
  .it .sum { grid-column:2 / 4; color:var(--muted); font-size:13px; margin-top:2px; display:none }
  .it.open .sum { display:block }
  .it.read .ttl a { color:var(--read) }
  .it .mk { border:0; background:none; color:var(--muted); cursor:pointer; font:inherit; font-size:12px; padding:0 4px }
  .it .mk:hover { color:var(--fg) }
  .more { display:block; width:100%; margin:16px 0; padding:8px; font:inherit; background:var(--chip); color:var(--fg); border:0; border-radius:3px; cursor:pointer }
  .empty { color:var(--muted); padding:24px 0 }
  footer { color:var(--muted); font-size:12px; margin-top:32px; border-top:1px solid var(--line); padding-top:8px }
  @media (max-width:600px) { .it { grid-template-columns:1fr auto } .it .tm { grid-column:1 / 3; order:-1 } .it .sum { grid-column:1 / 3 } }
</style>
</head>
<body>
<header>
  <h1>Feeds</h1>
  <span class="meta" id="meta"></span>
</header>

<div class="controls" id="tags"></div>
<div class="controls">
  <input type="search" id="q" placeholder="search titles…" autocomplete="off">
  <select id="feedsel"><option value="">all feeds</option></select>
  <label class="tog"><input type="checkbox" id="hideread"> hide read</label>
  <button class="chip" id="markall">mark shown as read</button>
</div>

<div id="list"></div>
<footer>Click a title to open it (marks read). Click the line to show the snippet. Read state is stored in this browser only. <a href="failures.txt">failures.txt</a></footer>

<script>
const DATA = /*__DATA__*/null;
const PAGE = 150;
const $ = s => document.querySelector(s);
const feedsById = Object.fromEntries(DATA.feeds.map(f => [f.id, f]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let read = new Set(store.get('read', []));
// forget read-marks for items no longer on the page so storage stays small
{ const live = new Set(DATA.items.map(i => i.k)); read = new Set([...read].filter(k => live.has(k))); store.set('read', [...read]); }

let state = { tag: store.get('tag', ''), q: '', feed: '', hideRead: store.get('hideRead', false), shown: PAGE };

// tag chips
const tagCounts = {};
for (const f of DATA.feeds) for (const t of f.tags) tagCounts[t] = (tagCounts[t] || 0) + 1;
const tags = Object.keys(tagCounts).sort((a, b) => a.localeCompare(b));
if (!tags.includes(state.tag)) state.tag = '';
function renderTags() {
  const el = $('#tags'); el.innerHTML = '';
  const mk = (label, val, n) => {
    const b = document.createElement('button'); b.className = 'chip' + (state.tag === val ? ' on' : '');
    b.innerHTML = label + (n != null ? ' <small>' + n + '</small>' : '');
    b.onclick = () => { state.tag = val; state.shown = PAGE; store.set('tag', val); renderTags(); renderFeedSel(); render(); };
    el.appendChild(b);
  };
  mk('all', '', DATA.feeds.length);
  for (const t of tags) mk(t, t, tagCounts[t]);
}
function renderFeedSel() {
  const sel = $('#feedsel'); const cur = state.feed;
  sel.innerHTML = '<option value="">all feeds</option>';
  const fs = DATA.feeds.filter(f => !state.tag || f.tags.includes(state.tag)).sort((a, b) => a.title.localeCompare(b.title));
  for (const f of fs) { const o = document.createElement('option'); o.value = f.id; o.textContent = f.title; sel.appendChild(o); }
  state.feed = fs.some(f => f.id === cur) ? cur : ''; sel.value = state.feed;
}

function visible() {
  const q = state.q.toLowerCase();
  return DATA.items.filter(i => {
    const f = feedsById[i.f]; if (!f) return false;
    if (state.tag && !f.tags.includes(state.tag)) return false;
    if (state.feed && i.f !== state.feed) return false;
    if (state.hideRead && read.has(i.k)) return false;
    if (q && !(i.t.toLowerCase().includes(q) || f.title.toLowerCase().includes(q))) return false;
    return true;
  });
}
const fmtDay = ts => new Date(ts * 1000).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const items = visible(); const list = $('#list'); list.innerHTML = '';
  $('#meta').textContent = items.length + ' items · ' + DATA.feeds.length + ' feeds · updated ' + new Date(DATA.generated * 1000).toLocaleString();
  if (!items.length) { list.innerHTML = '<div class="empty">nothing here.</div>'; return; }
  let lastDay = ''; const frag = document.createDocumentFragment();
  for (const i of items.slice(0, state.shown)) {
    const day = fmtDay(i.d);
    if (day !== lastDay) { const h = document.createElement('div'); h.className = 'day'; h.textContent = day; frag.appendChild(h); lastDay = day; }
    const f = feedsById[i.f];
    const row = document.createElement('div'); row.className = 'it' + (read.has(i.k) ? ' read' : ''); row.dataset.k = i.k;
    row.innerHTML =
      '<span class="tm">' + fmtTime(i.d) + '</span>' +
      '<span class="ttl"><a href="' + esc(i.l || '#') + '" target="_blank" rel="noopener">' + esc(i.t) + '</a> <span class="src">' + esc(f.title) + '</span></span>' +
      '<button class="mk" title="toggle read">' + (read.has(i.k) ? '↺' : '✓') + '</button>' +
      (i.s ? '<div class="sum">' + esc(i.s) + '</div>' : '');
    row.querySelector('a').addEventListener('click', () => mark(i.k, true, row));
    row.querySelector('.mk').addEventListener('click', e => { e.stopPropagation(); mark(i.k, !read.has(i.k), row); });
    row.addEventListener('click', e => { if (e.target.closest('a,button')) return; row.classList.toggle('open'); });
    frag.appendChild(row);
  }
  list.appendChild(frag);
  if (items.length > state.shown) {
    const b = document.createElement('button'); b.className = 'more'; b.textContent = 'show more (' + (items.length - state.shown) + ' left)';
    b.onclick = () => { state.shown += PAGE; render(); }; list.appendChild(b);
  }
}
function mark(k, on, row) {
  if (on) read.add(k); else read.delete(k);
  store.set('read', [...read]);
  if (row) { row.classList.toggle('read', on); row.querySelector('.mk').textContent = on ? '↺' : '✓'; if (on && state.hideRead) setTimeout(render, 150); }
}

$('#q').addEventListener('input', e => { state.q = e.target.value; state.shown = PAGE; render(); });
$('#feedsel').addEventListener('change', e => { state.feed = e.target.value; state.shown = PAGE; render(); });
$('#hideread').checked = state.hideRead;
$('#hideread').addEventListener('change', e => { state.hideRead = e.target.checked; store.set('hideRead', state.hideRead); state.shown = PAGE; render(); });
$('#markall').addEventListener('click', () => { for (const i of visible()) read.add(i.k); store.set('read', [...read]); render(); });

renderTags(); renderFeedSel(); render();
</script>
</body>
</html>
